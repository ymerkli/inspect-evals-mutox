name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Type check
        run: uv run mypy src tests
      - name: Tests
        # No network and no model calls: audio fetches are stubbed and
        # generation goes through mockllm.
        run: uv run pytest
      - name: Eval is discoverable
        run: uv run python -c "import mutox; print(mutox.mutox)"
